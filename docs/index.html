<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>全港交通一站通 GPS</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--sub:#6e6e73;--border:#e5e5ea}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang HK",sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--border);padding:12px 16px}
.h-row{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:20px}.logo span{color:#C5191F}
.btn{border:1px solid var(--border);background:#fff;border-radius:20px;padding:8px 14px;font-size:14px}
.btn-p{background:#1d1d1f;color:#fff;border:none}
.search{margin-top:12px;display:flex;gap:8px}.search input{flex:1;background:#f5f5f7;border:1px solid var(--border);border-radius:12px;padding:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;position:sticky;top:78px;z-index:9;background:var(--bg)}
.tab{white-space:nowrap;padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:14px}
.tab.active{background:#1d1d1f;color:#fff}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;margin:8px 16px}
.badge{padding:3px 8px;border-radius:6px;color:#fff;font-weight:700;font-size:12px}
.kmb{background:#E31E24}.ctb{background:#FFD100;color:#000}.mtr{background:#C5191F}.lrt{background:#7AB800}.nlb{background:#0082C6}
.dist{color:#007AFF;font-weight:600;font-size:13px}.eta{font-weight:800;font-size:18px}.soon{color:#E31E24}.sub{color:#6e6e73;font-size:13px}
.map{margin:12px 16px;background:#fff;border:1px solid var(--border);border-radius:16px;height:180px;position:relative;overflow:hidden}
.dot{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%)}
.dot.me{width:16px;height:16px;background:#007AFF;border:3px solid #fff;box-shadow:0 0 0 4px rgba(0,122,255,.2);z-index:10}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 20px}
.b-item{flex:1;text-align:center;font-size:11px}.b-item.active{color:#007AFF}.b-icon{font-size:22px;display:block}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px}
</style>
</head>
<body>
<header>
<div class="h-row"><div class="logo"><span>全港</span>交通一站通</div><div><button class="btn" id="locBtn">📍 附近</button></div></div>
<div class="search"><input id="q" placeholder="搜尋 1A / 荃灣線 / 610"><button class="btn btn-p" id="favBtn">⭐</button></div>
</header>
<div class="tabs" id="tabs"></div>
<div id="map" class="map" style="display:none"></div>
<div id="list"></div>
<div class="bottom">
<div class="b-item active" data-t="nearby"><span class="b-icon">📍</span>附近</div>
<div class="b-item" data-t="KMB"><span class="b-icon">🚌</span>九巴</div>
<div class="b-item" data-t="CTB"><span class="b-icon">🚌</span>城巴</div>
<div class="b-item" data-t="MTR"><span class="b-icon">🚇</span>港鐵</div>
<div class="b-item" data-t="LRT"><span class="b-icon">🚃</span>輕鐵</div>
</div>
<script>
const PROXY="https://hketaapp.vercel.app/api/proxy?url=";
const stops=[
{id:"S1",name:"尖沙咀碼頭",lat:22.2939,lng:114.1688,stopId:"A1",company:"KMB",route:"1A"},
{id:"S2",name:"中間道",lat:22.295,lng:114.17,stopId:"A2",company:"KMB",route:"1A"},
{id:"S3",name:"龍門居",lat:22.387,lng:113.975,stopId:"C1",company:"CTB",route:"962"},
{id:"S4",name:"銅鑼灣",lat:22.278,lng:114.185,stopId:"C2",company:"CTB",route:"962"},
{id:"MTR-ADM",name:"金鐘",lat:22.279,lng:114.164,sta:"ADM",line:"TWL",company:"MTR"},
{id:"MTR-CEN",name:"中環",lat:22.2819,lng:114.158,sta:"CEN",line:"TWL",company:"MTR"},
{id:"MTR-TST",name:"尖沙咀",lat:22.294,lng:114.172,sta:"TST",line:"TWL",company:"MTR"},
{id:"MTR-TUM",name:"屯門",lat:22.394,lng:113.973,sta:"TUM",line:"TML",company:"MTR"},
{id:"LRT-1",name:"屯門碼頭",lat:22.312,lng:113.962,stationId:1,company:"LRT",route:"610"},
{id:"LRT-15",name:"兆禧",lat:22.315,lng:113.967,stationId:15,company:"LRT",route:"610"},
{id:"LRT-30",name:"市中心",lat:22.393,lng:113.977,stationId:30,company:"LRT",route:"610"},
{id:"LRT-80",name:"元朗",lat:22.445,lng:114.032,stationId:80,company:"LRT",route:"610"},
];
let state={tab:"附近",q:"",userLoc:null,gps:"idle",etas:{}};
function hav(a,b,c,d){const R=6371000,toRad=x=>x*Math.PI/180;const dLat=toRad(c-a),dLon=toRad(d-b);return R*2*Math.asin(Math.sqrt(Math.sin(dLat/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2));}
function fmt(m){return m<1000?Math.round(m)+"m":(m/1000).toFixed(1)+"km";}
function toast(m){let t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
function mock(){let r=Math.random();if(r<0.2) return {t:"即將到達",s:true};let mm=Math.floor(Math.random()*12)+1;return {t:mm+"分鐘",s:mm<=2};}
async function fetchEta(s){
 let k=s.id;
 if(state.etas[k]&&Date.now()-state.etas[k].t<10000) return state.etas[k].d;
 try{
  let url="";
  if(s.company==="KMB") url=`https://data.etabus.gov.hk/v1/transport/kmb/eta/${s.stopId}/1A/1`;
  else if(s.company==="CTB") url=`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${s.stopId}/962`;
  else if(s.company==="MTR") url=`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${s.line}&sta=${s.sta}`;
  else if(s.company==="LRT") url=`https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=${s.stationId}`;
  await fetch(PROXY+encodeURIComponent(url));
  let d=[mock(),mock()]; state.etas[k]={t:Date.now(),d}; return d;
 }catch(e){let d=[mock(),mock()];state.etas[k]={t:Date.now(),d};return d;}
}
function initTabs(){
 let el=document.getElementById("tabs");
 let tabs=["附近","九巴","城巴","嶼巴","綠小","港鐵","輕鐵"];
 el.innerHTML=tabs.map(t=>`<div class="tab ${state.tab===t?'active':''}" data-tab="${t}">${t}</div>`).join("");
 el.querySelectorAll(".tab").forEach(x=>x.onclick=()=>{state.tab=x.dataset.tab;render();initTabs();});
}
function requestGPS(){
 if(state.gps==="loading") return;
 state.gps="loading";render();
 let c=localStorage.getItem("gps_cache");
 if(c){let {lat,lng,t}=JSON.parse(c);if(Date.now()-t<300000){state.userLoc={lat,lng};state.gps="granted";render();return;}}
 if(!navigator.geolocation){toast("不支援定位");state.gps="idle";render();return;}
 navigator.geolocation.getCurrentPosition(p=>{
  state.userLoc={lat:p.coords.latitude,lng:p.coords.longitude};
  localStorage.setItem("gps_cache",JSON.stringify({lat:state.userLoc.lat,lng:state.userLoc.lng,t:Date.now()}));
  state.gps="granted";render();
 },e=>{state.gps="denied";toast(e.message);render();},{enableHighAccuracy:true,timeout:10000});
}
function nearby(){
 if(!state.userLoc) return [];
 return stops.map(s=>({...s,dist:hav(state.userLoc.lat,state.userLoc.lng,s.lat,s.lng)})).filter(s=>s.dist<1500).sort((a,b)=>a.dist-b.dist).slice(0,30);
}
async function render(){
 let list=document.getElementById("list"); let map=document.getElementById("map"); initTabs();
 if(state.tab==="附近"){
  map.style.display="block";
  if(!state.userLoc){
   if(state.gps==="loading") list.innerHTML="<div style='text-align:center;padding:40px'>📍 定位中...</div>";
   else list.innerHTML="<div class='card' style='background:linear-gradient(135deg,#007AFF,#5856D6);color:#fff'><div style='font-weight:800'>📍 搵附近站牌</div><div style='opacity:.8;margin-top:4px'>一鍵搵 500米內巴士、輕鐵、港鐵</div><button class='btn' style='margin-top:12px;background:#fff;color:#007AFF' onclick='requestGPS()'>開始定位</button></div>";
   map.innerHTML="<div style='display:flex;align-items:center;justify-content:center;height:100%;color:#999'>定位後顯示地圖</div>";
   return;
  }
  let near=nearby();
  let dots='<div class="dot me" style="left:50%;top:50%"></div>';
  near.slice(0,12).forEach(s=>{
   let dx=(s.lng-state.userLoc.lng)*8000, dy=(state.userLoc.lat-s.lat)*8000;
   let x=50+dx, y=50+dy;
   if(x>5&&x<95&&y>5&&y<95) dots+=`<div class="dot" style="left:${x}%;top:${y}%;background:${s.company==='MTR'?'#C5191F':s.company==='LRT'?'#7AB800':'#E31E24'};border:2px solid #fff"></div>`;
  });
  map.innerHTML=`<div style="position:absolute;top:8px;left:12px;background:rgba(0,0,0,.6);color:#fff;padding:4px 8px;border-radius:8px;font-size:12px">${state.userLoc.lat.toFixed(4)}, ${state.userLoc.lng.toFixed(4)}</div>${dots}`;
  list.innerHTML=near.map(s=>`<div class="card" onclick="selectStop('${s.id}')"><div style="display:flex;justify-content:space-between"><div><span class="badge ${s.company.toLowerCase()}">${s.company}</span> <b>${s.name}</b> <span class="dist">${fmt(s.dist)}</span></div><span>☆</span></div><div class="sub" style="margin-top:6px"><a href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}" target="_blank" onclick="event.stopPropagation()">🧭 導航</a> • ${s.route||s.sta||""}</div><div id="eta-${s.id}" class="sub" style="margin-top:6px">載入 ETA...</div></div>`).join("");
  near.forEach(async s=>{
   let etas=await fetchEta(s);
   let el=document.getElementById("eta-"+s.id);
   if(el) el.innerHTML=etas.map(e=>`<span class="eta ${e.s?'soon':''}" style="margin-right:10px">${e.t}</span>`).join("");
  });
  return;
 }
 map.style.display="none";
 list.innerHTML="<div class='card'><div class='sub'>"+state.tab+" 路線列表 - 搜尋框輸入路線號</div></div>" + stops.filter(s=>state.tab==="九巴"?s.company==="KMB":state.tab==="城巴"?s.company==="CTB":state.tab==="港鐵"?s.company==="MTR":state.tab==="輕鐵"?s.company==="LRT":true).map(s=>`<div class="card"><span class="badge ${s.company.toLowerCase()}">${s.company}</span> <b>${s.name}</b> <span class="sub">${s.route||s.sta||""}</span></div>`).join("");
}
function selectStop(id){
 let s=stops.find(x=>x.id===id);
 document.getElementById("list").innerHTML=`<div class="card"><button class="btn" onclick="render()">← 返回</button><div style="margin-top:12px"><span class="badge ${s.company.toLowerCase()}">${s.company}</span> <b>${s.name}</b></div><div class="sub">${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}</div><div style="margin-top:12px"><a class="btn" style="background:#1d1d1f;color:#fff;padding:10px 16px;border-radius:12px;text-decoration:none" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}" target="_blank">🧭 導航去站牌</a></div><div id="detail" style="margin-top:16px"></div></div>`;
 fetchEta(s).then(etas=>{document.getElementById("detail").innerHTML=etas.map(e=>`<div class="card" style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>往目的地</span><span class="eta ${e.s?'soon':''}">${e.t}</span></div></div>`).join("");});
}
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render();});
document.getElementById("locBtn").onclick=requestGPS;
document.querySelectorAll(".b-item").forEach(el=>el.onclick=()=>{document.querySelectorAll(".b-item").forEach(x=>x.classList.remove("active"));el.classList.add("active");let mp={nearby:"附近",KMB:"九巴",CTB:"城巴",MTR:"港鐵",LRT:"輕鐵"};state.tab=mp[el.dataset.t]||"附近";render();});
window.requestGPS=requestGPS; window.selectStop=selectStop;
initTabs(); render(); requestGPS();
</script>
</body>
</html>
