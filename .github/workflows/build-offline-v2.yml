name: Build APK - OFFLINE GPS V2 Fixed Log

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create OFFLINE project
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/hkbus/allinone
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOFF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS) { repositories { google(); mavenCentral() } } }
          include ':app'
          EOFF

          cat > build.gradle <<'EOFF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOFF

          cat > gradle.properties <<'EOFF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOFF

          cat > app/build.gradle <<'EOFF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.hkbus.allinone'
              compileSdk 34
              defaultConfig { applicationId "com.hkbus.allinone"; minSdk 24; targetSdk 34; versionCode 16; versionName "3.1-offline" }
          }
          EOFF

          cat > app/src/main/res/values/strings.xml <<'EOFF'
          <resources><string name="app_name">全港交通</string></resources>
          EOFF

          cat > app/src/main/AndroidManifest.xml <<'EOFF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <application android:label="@string/app_name" android:theme="@android:style/Theme.NoTitleBar" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
            </application>
          </manifest>
          EOFF

          cat > app/src/main/assets/index.html <<'HTMLEOF'
          <!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全港交通 GPS 離線版</title>
          <style>body{font-family:sans-serif;background:#f5f5f7;margin:0;padding-bottom:80px}header{position:sticky;top:0;background:#fff;padding:12px;border-bottom:1px solid #ddd}.logo{font-weight:800;font-size:20px}.logo span{color:#C5191F}.btn{border:1px solid #ddd;background:#fff;border-radius:20px;padding:8px 14px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:14px;margin:8px 16px}.badge{padding:3px 8px;border-radius:6px;color:#fff;font-weight:700;font-size:12px}.kmb{background:#E31E24}.mtr{background:#C5191F}.lrt{background:#7AB800}.dist{color:#007AFF;font-weight:600}.eta{font-weight:800}.sub{color:#888;font-size:13px}.map{margin:12px 16px;background:#fff;border:1px solid #ddd;border-radius:16px;height:160px;position:relative;overflow:hidden}.dot{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%)}.dot.me{width:16px;height:16px;background:#007AFF;border:3px solid #fff}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0 18px}.b-item{flex:1;text-align:center;font-size:11px}.b-item.active{color:#007AFF}</style></head><body>
          <header><div style="display:flex;justify-content:space-between"><div class="logo"><span>全港</span>交通一站通</div><button class="btn" id="locBtn">📍 附近</button></div></header>
          <div id="map" class="map"></div><div id="list"></div>
          <div class="bottom"><div class="b-item active">📍 附近</div><div class="b-item">🚌 九巴</div><div class="b-item">🚇 港鐵</div><div class="b-item">🚃 輕鐵</div></div>
          <script>
          const stops=[{id:"S1",name:"尖沙咀碼頭",lat:22.2939,lng:114.1688,company:"KMB"},{id:"MTR-CEN",name:"中環",lat:22.2819,lng:114.158,company:"MTR"},{id:"MTR-ADM",name:"金鐘",lat:22.279,lng:114.164,company:"MTR"},{id:"LRT-1",name:"屯門碼頭",lat:22.312,lng:113.962,company:"LRT"},{id:"LRT-80",name:"元朗",lat:22.445,lng:114.032,company:"LRT"}];
          let userLoc=null;
          function hav(a,b,c,d){const R=6371000,toRad=x=>x*Math.PI/180;const dLat=toRad(c-a),dLon=toRad(d-b);return R*2*Math.asin(Math.sqrt(Math.sin(dLat/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2));}
          function fmt(m){return m<1000?Math.round(m)+"m":(m/1000).toFixed(1)+"km";}
          function requestGPS(){if(!navigator.geolocation)return;document.getElementById("list").innerHTML="<div style='text-align:center;padding:20px'>📍 定位中...</div>";navigator.geolocation.getCurrentPosition(p=>{userLoc={lat:p.coords.latitude,lng:p.coords.longitude};render();},e=>{document.getElementById("list").innerHTML="定位失敗: "+e.message;},{enableHighAccuracy:true,timeout:10000});}
          function render(){let map=document.getElementById("map");let list=document.getElementById("list");if(!userLoc){map.innerHTML="<div style='display:flex;align-items:center;justify-content:center;height:100%;color:#999'>按 📍 開始定位</div>";list.innerHTML="<div class='card' style='background:linear-gradient(135deg,#007AFF,#5856D6);color:#fff'><div style='font-weight:800'>📍 搵附近站牌</div><div style='opacity:.8;margin-top:4px'>500米內巴士、輕鐵、港鐵</div><button class='btn' style='margin-top:12px;background:#fff;color:#007AFF' onclick='requestGPS()'>開始定位</button></div>";return;}let near=stops.map(s=>({...s,dist:hav(userLoc.lat,userLoc.lng,s.lat,s.lng)})).filter(s=>s.dist<2000).sort((a,b)=>a.dist-b.dist);let dots='<div class="dot me" style="left:50%;top:50%"></div>';near.forEach(s=>{let dx=(s.lng-userLoc.lng)*8000,dy=(userLoc.lat-s.lat)*8000;let x=50+dx,y=50+dy;if(x>5&&x<95&&y>5&&y<95) dots+=`<div class="dot" style="left:${x}%;top:${y}%;background:${s.company==='MTR'?'#C5191F':s.company==='LRT'?'#7AB800':'#E31E24'};border:2px solid #fff"></div>`;});map.innerHTML=`<div style="position:absolute;top:8px;left:12px;background:rgba(0,0,0,.6);color:#fff;padding:4px 8px;border-radius:8px;font-size:12px">${userLoc.lat.toFixed(4)}, ${userLoc.lng.toFixed(4)}</div>${dots}`;list.innerHTML=near.map(s=>`<div class="card"><span class="badge ${s.company.toLowerCase()}">${s.company}</span> <b>${s.name}</b> <span class="dist">${fmt(s.dist)}</span><div class="sub" style="margin-top:6px"><a href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}" target="_blank">🧭 導航</a> • ${Math.floor(Math.random()*10)+1}分鐘</div></div>`).join("");}
          document.getElementById("locBtn").onclick=requestGPS;
          window.requestGPS=requestGPS;
          render(); requestGPS();
          </script></body></html>
          HTMLEOF

          cat > app/src/main/java/com/hkbus/allinone/MainActivity.java <<'EOFF'
          package com.hkbus.allinone;
          import android.app.Activity; import android.os.Bundle; import android.webkit.*;
          public class MainActivity extends Activity {
              WebView wv;
              protected void onCreate(Bundle b){
                  super.onCreate(b);
                  wv=new WebView(this);
                  wv.getSettings().setJavaScriptEnabled(true);
                  wv.getSettings().setDomStorageEnabled(true);
                  wv.getSettings().setGeolocationEnabled(true);
                  wv.setWebChromeClient(new WebChromeClient(){
                      public void onGeolocationPermissionsShowPrompt(String o, GeolocationPermissions.Callback c){c.invoke(o,true,false);}
                  });
                  wv.setWebViewClient(new WebViewClient());
                  wv.loadUrl("file:///android_asset/index.html");
                  setContentView(wv);
              }
              public void onBackPressed(){ if(wv.canGoBack()) wv.goBack(); else super.onBackPressed(); }
          }
          EOFF

      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '17' }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.5', cache-disabled: true }

      - name: Install SDK 34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build APK with log
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
          echo "GRADLE_EXIT=${PIPESTATUS[0]}" | tee -a build.log

      - name: Upload log and APK always
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-result
          path: |
            build.log
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
